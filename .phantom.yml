phantom: "1"
project: "wtfscore"
name: "WTFScore"
description: "Current-feature simulated prototype showcase"
setup:
  type: "wtfscore-web"
  run:
    command: "node server.mjs"
    ready_check:
      type: "http"
      url: "http://127.0.0.1:4317/"
      timeout: 15
  runner_timeout: 120
capture_defaults:
  theme: "dark"
  full_page: false
  timeout: 15
  retry:
    max_attempts: 1
    backoff_ms: 0
captures:
  -
    id: "01-tv-scoreboard"
    name: "NFL week board with a favorite team"
    route: "/"
    output: "docs/screenshots/01-tv-scoreboard.png"
    alt_text: "NFL week board with a favorite team. Simulated fixture data."
    viewport:
      width: 960
      height: 540
    device_scale: 2
    actions:
      -
        type: "wait_for"
        selector: ".card"
      -
        type: "wait"
        ms: 3000
      -
        type: "click"
        selector: "#header-league"
      -
        type: "click"
        selector: "#header-league-options [data-value=\"nfl\"]"
      -
        type: "click"
        selector: "#header-period"
      -
        type: "click"
        selector: "#header-period-options [data-value=\"2026|w11\"]"
      -
        type: "click"
        selector: "#menu-btn"
      -
        type: "click"
        selector: "#menu-favorites"
      -
        type: "press"
        key: "w"
      -
        type: "press"
        key: "Enter"
      -
        type: "click"
        selector: "[aria-label=\"Close menu\"]"
      -
        type: "press"
        key: "Control+Home"
      -
        type: "wait"
        ms: 1000
      -
        type: "evaluate"
        js: "() => {\n const visible = e => Boolean(e && !e.hidden && e.getClientRects().length);\n const header = document.querySelector('#head');\n const sim = document.querySelector('.head-sim');\n const hr = header.getBoundingClientRect(), sr = sim.getBoundingClientRect();\n if (!visible(sim) || sr.top < 0 || sr.bottom > innerHeight || !sim.textContent.includes('SIMULATED')) throw Error('Simulation marker outside frame');\n const league = document.querySelector('#header-league').textContent;\n if (!league.includes(\"NFL\")) throw Error('Wrong league');\n if(Date.now()!==Date.parse('2026-11-15T21:50:00Z')) throw Error('Capture clock mismatch');\n const cards = [...document.querySelectorAll('.card')];\n if (!cards.length || !(document.querySelectorAll('.card.fav-on').length>0)) throw Error('Required UI state missing');\n const favorite = cards.map(c=>c.classList.contains('fav-on'));\n let otherSeen=false; for(const value of favorite){ if(!value) otherSeen=true; else if(otherSeen) throw Error('Favorite order violated'); }\n const state = {id:\"01-tv-scoreboard\",league,period:document.querySelector('#header-period').textContent,filters:[...document.querySelectorAll('.header-choice')].filter(visible).map(r=>r.innerText),card_count:cards.length,visible_cards:cards.filter(c=>{const r=c.getBoundingClientRect();return r.top>=0&&r.bottom<=innerHeight}).length,favorites:cards.filter(c=>c.classList.contains('fav-on')).map(c=>c.dataset.id),header_height:hr.height,simulation_text_in_dom:true,app_simulation_exposed:(()=>{const e=document.elementFromPoint(sr.left+sr.width/2,sr.top+sr.height/2);return e===sim||sim.contains(e);})(),viewport:[innerWidth,innerHeight],details:document.querySelector('#details:not([hidden])')?.innerText||null,expected_ocr:[\"NFL\", \"Week\", \"SIMULATED\"]};\n console.info('WTFScore capture evidence: '+JSON.stringify(state));\n }"
